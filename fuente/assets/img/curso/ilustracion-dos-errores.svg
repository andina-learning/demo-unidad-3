<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img"
     aria-label="Dos escenas lado a lado. A la izquierda, una base de datos con un candado puesto sobre ella: una flecha que llega desde fuera, el acceso no autorizado al medio, se detiene contra una barrera antes del candado; otra flecha sale del candado sin detenerse hasta la pantalla de un usuario legítimo, que ve los registros. Debajo, su nombre: cifrado. A la derecha, una tabla de datos con filas y columnas; en una fila, tres celdas juntas, rodeadas por el único contorno amarillo, son una combinación de atributos, y de ella sale una flecha que llega a una persona. Debajo, su nombre: anonimizado.">
  <!-- Ilustración de marca · Universidad Andina Virtual · Unidad 3 (v2) · introducción (cuerpo)
       Concepto (DI): «Dos errores conviene evitar de manera explícita: suponer que cifrar
       equivale a cumplir, cuando el cifrado protege frente a un acceso no autorizado al medio
       pero no frente a un usuario legítimo que consulta lo que no le corresponde; y declarar
       anonimizado un conjunto de datos que conserva combinaciones de atributos capaces de
       reidentificar a una persona.» Las dos escenas, lado a lado; los rótulos son literales.
       El candado sobre el dato es el de ilustracion-cadena.svg; aquí lo nombra «cifrado».
       Guion en insumos/ILUSTRACIONES.md.
       Único amarillo: el contorno de la combinación de atributos, lo que el conjunto conserva
       aunque se declare anonimizado. En la escena izquierda el sentido lo lleva la geometría
       (una flecha se detiene, la otra pasa); en la derecha, solo el color separa esas tres
       celdas de las demás. -->
  <defs>
    <linearGradient id="ilu-doserrores-fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#E6F3FA"/>
      <stop offset="55%"  stop-color="#E8EDF5"/>
      <stop offset="100%" stop-color="#F5F8FB"/>
    </linearGradient>
    <filter id="ilu-doserrores-sombra" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#132B41" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="18" fill="url(#ilu-doserrores-fondo)"/>

  <!-- Las dos escenas -->
  <g filter="url(#ilu-doserrores-sombra)" fill="#FFFFFF">
    <rect x="40"  y="70" width="540" height="270" rx="16"/>
    <rect x="620" y="70" width="540" height="270" rx="16"/>
  </g>

  <!-- ══ 1 · Cifrado: protege el medio, no frente al usuario legítimo ══ -->
  <!-- el medio, con el candado puesto sobre él -->
  <path d="M246 130 v120 a54 15 0 0 0 108 0 v-120" fill="#DCE8F3" stroke="#00417B" stroke-width="3" opacity=".9"/>
  <g fill="none" stroke="#00417B" stroke-width="3" opacity=".35">
    <path d="M246 170 a54 15 0 0 0 108 0"/>
    <path d="M246 210 a54 15 0 0 0 108 0"/>
  </g>
  <ellipse cx="300" cy="130" rx="54" ry="15" fill="#C5DCEB" stroke="#00417B" stroke-width="3"/>
  <path d="M288 190 v-12 a12 12 0 0 1 24 0 v12" fill="none" stroke="#132B41" stroke-width="6"
        stroke-linecap="round"/>
  <rect x="276" y="188" width="48" height="40" rx="8" fill="#132B41"/>
  <circle cx="300" cy="204" r="5" fill="#FFFFFF"/>
  <rect x="298" y="206" width="4" height="12" rx="2" fill="#FFFFFF"/>

  <!-- el acceso no autorizado al medio: llega desde fuera y se detiene -->
  <g fill="none" stroke="#132B41" stroke-linecap="round" stroke-linejoin="round">
    <line x1="72" y1="200" x2="220" y2="200" stroke-width="3" opacity=".45"/>
    <path d="M212 192 l8 8 -8 8" stroke-width="3" opacity=".45"/>
    <line x1="234" y1="176" x2="234" y2="224" stroke-width="5" opacity=".85"/>
  </g>

  <!-- el usuario legítimo: lo que consulta sale del medio cifrado sin detenerse -->
  <g fill="none" stroke="#00417B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".75">
    <line x1="332" y1="214" x2="408" y2="214"/>
    <path d="M402 206 l8 8 -8 8"/>
  </g>
  <circle cx="482" cy="122" r="13" fill="none" stroke="#00417B" stroke-width="4"/>
  <path d="M462 160 a20 15 0 0 1 40 0" fill="none" stroke="#00417B" stroke-width="4" stroke-linecap="round"/>
  <rect x="420" y="176" width="124" height="76" rx="8" fill="#DCE8F3" stroke="#132B41" stroke-width="3" opacity=".9"/>
  <rect x="474" y="252" width="16" height="8" fill="#132B41" opacity=".3"/>
  <rect x="462" y="260" width="40" height="5" rx="2.5" fill="#132B41" opacity=".3"/>
  <g fill="#00417B" opacity=".55">
    <circle cx="438" cy="196" r="4"/>
    <circle cx="438" cy="214" r="4"/>
    <circle cx="438" cy="232" r="4"/>
  </g>
  <g fill="#132B41" opacity=".3">
    <rect x="450" y="192" width="80" height="8" rx="4"/>
    <rect x="450" y="210" width="64" height="8" rx="4"/>
    <rect x="450" y="228" width="76" height="8" rx="4"/>
  </g>

  <!-- ══ 2 · Anonimizado: el conjunto conserva una combinación que reidentifica ══ -->
  <!-- los nombres de las columnas -->
  <g fill="#132B41" opacity=".85">
    <rect x="664" y="106" width="44" height="9" rx="4.5"/>
    <rect x="736" y="106" width="52" height="9" rx="4.5"/>
    <rect x="808" y="106" width="40" height="9" rx="4.5"/>
    <rect x="880" y="106" width="48" height="9" rx="4.5"/>
  </g>
  <rect x="664" y="128" width="276" height="2.5" rx="1.25" fill="#132B41" opacity=".12"/>
  <!-- las filas del conjunto de datos -->
  <g fill="#132B41" opacity=".12">
    <rect x="664" y="140" width="60" height="20" rx="4"/><rect x="736" y="140" width="60" height="20" rx="4"/><rect x="808" y="140" width="60" height="20" rx="4"/><rect x="880" y="140" width="60" height="20" rx="4"/>
    <rect x="664" y="170" width="60" height="20" rx="4"/><rect x="736" y="170" width="60" height="20" rx="4"/><rect x="808" y="170" width="60" height="20" rx="4"/><rect x="880" y="170" width="60" height="20" rx="4"/>
    <rect x="664" y="204" width="60" height="20" rx="4"/>
    <rect x="664" y="238" width="60" height="20" rx="4"/><rect x="736" y="238" width="60" height="20" rx="4"/><rect x="808" y="238" width="60" height="20" rx="4"/><rect x="880" y="238" width="60" height="20" rx="4"/>
    <rect x="664" y="268" width="60" height="20" rx="4"/><rect x="736" y="268" width="60" height="20" rx="4"/><rect x="808" y="268" width="60" height="20" rx="4"/><rect x="880" y="268" width="60" height="20" rx="4"/>
  </g>
  <!-- la combinación de atributos que se conserva -->
  <g fill="#00417B" opacity=".55">
    <rect x="736" y="204" width="60" height="20" rx="4"/>
    <rect x="808" y="204" width="60" height="20" rx="4"/>
    <rect x="880" y="204" width="60" height="20" rx="4"/>
  </g>
  <!-- ÚNICO AMARILLO: la combinación de atributos, lo que el conjunto «anonimizado» conserva -->
  <rect x="728" y="196" width="220" height="36" rx="10" fill="none" stroke="#F0B443" stroke-width="4"/>

  <!-- capaz de reidentificar a una persona -->
  <g fill="none" stroke="#00417B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".75">
    <line x1="958" y1="214" x2="1032" y2="214"/>
    <path d="M1026 206 l8 8 -8 8"/>
  </g>
  <circle cx="1086" cy="196" r="13" fill="none" stroke="#00417B" stroke-width="4"/>
  <path d="M1066 234 a20 15 0 0 1 40 0" fill="none" stroke="#00417B" stroke-width="4" stroke-linecap="round"/>

  <!-- Rótulos, literales del DI -->
  <g font-family="Manrope, system-ui, sans-serif" font-size="13" font-weight="600" fill="#00417B" text-anchor="middle">
    <text x="146" y="236">acceso no autorizado</text>
    <text x="146" y="254">al medio</text>
    <text x="482" y="294">usuario legítimo</text>
    <text x="838" y="318">combinaciones de atributos</text>
  </g>
  <g font-family="Manrope, system-ui, sans-serif" font-size="17" font-weight="600" fill="#132B41" text-anchor="middle">
    <text x="310" y="384">cifrado</text>
    <text x="890" y="384">anonimizado</text>
  </g>
</svg>
