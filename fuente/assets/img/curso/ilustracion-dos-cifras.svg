<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img"
     aria-label="A la izquierda, un tablero en pantalla con una cifra grande y unas barras; a la derecha, un informe de papel con un sobre en la esquina y otra cifra, más corta. Los dos llevan la misma etiqueta, mismo mes, y entre ellos está el signo de distinto. De los dos bajan líneas punteadas hasta el lugar donde debería estar la regla que define la cifra: un documento vacío, sin firma y sin sello.">
  <!-- Ilustración de marca · Universidad Andina Virtual · Unidad 3, tema 1 (apertura)
       Concepto (DI): el tablero de la gerencia médica y el reporte enviado a la aseguradora
       informan cifras distintas de atenciones del mismo mes; nadie tenía autoridad para
       decidir y nadie respondía por el resultado. Las cifras se dibujan como bloques, no
       como números: el DI no dice cuáles son. Guion en insumos/ILUSTRACIONES.md.
       Único amarillo: el contorno del documento de la regla, que está vacío. -->
  <defs>
    <linearGradient id="ilu-doscifras-fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#E6F3FA"/>
      <stop offset="55%"  stop-color="#E8EDF5"/>
      <stop offset="100%" stop-color="#F5F8FB"/>
    </linearGradient>
    <filter id="ilu-doscifras-sombra" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#132B41" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="440" rx="18" fill="url(#ilu-doscifras-fondo)"/>

  <!-- ══ Izquierda · el tablero de la gerencia médica ══ -->
  <g filter="url(#ilu-doscifras-sombra)">
    <rect x="100" y="52" width="380" height="204" rx="16" fill="#FFFFFF"/>
  </g>
  <!-- pie de pantalla -->
  <rect x="274" y="256" width="32" height="16" fill="#132B41" opacity=".18"/>
  <rect x="236" y="270" width="108" height="9" rx="4.5" fill="#132B41" opacity=".22"/>
  <!-- la etiqueta del periodo -->
  <rect x="132" y="76" width="118" height="28" rx="14" fill="#00417B" opacity=".12"/>
  <text x="191" y="95" text-anchor="middle" font-family="Manrope, system-ui, sans-serif"
        font-size="14" font-weight="600" fill="#132B41">mismo mes</text>
  <!-- la cifra: silueta de un número, sin decir cuál -->
  <g fill="#132B41" opacity=".85">
    <rect x="132" y="124" width="36" height="56" rx="8"/>
    <rect x="180" y="124" width="36" height="56" rx="8"/>
    <rect x="228" y="124" width="28" height="56" rx="8"/>
    <rect x="268" y="124" width="36" height="56" rx="8"/>
  </g>
  <!-- las barras del tablero -->
  <g fill="#00417B">
    <rect x="132" y="210" width="18" height="22" rx="4" opacity=".35"/>
    <rect x="162" y="198" width="18" height="34" rx="4" opacity=".52"/>
    <rect x="192" y="188" width="18" height="44" rx="4" opacity=".78"/>
    <rect x="222" y="202" width="18" height="30" rx="4" opacity=".55"/>
  </g>
  <rect x="132" y="232" width="138" height="3" rx="1.5" fill="#132B41" opacity=".14"/>

  <!-- ══ Derecha · el reporte enviado a la aseguradora ══ -->
  <g filter="url(#ilu-doscifras-sombra)">
    <rect x="720" y="52" width="380" height="204" rx="16" fill="#FFFFFF"/>
  </g>
  <!-- la misma etiqueta del periodo -->
  <rect x="752" y="76" width="118" height="28" rx="14" fill="#00417B" opacity=".12"/>
  <text x="811" y="95" text-anchor="middle" font-family="Manrope, system-ui, sans-serif"
        font-size="14" font-weight="600" fill="#132B41">mismo mes</text>
  <!-- la otra cifra: otra silueta, más corta -->
  <g fill="#132B41" opacity=".85">
    <rect x="752" y="124" width="36" height="56" rx="8"/>
    <rect x="800" y="124" width="28" height="56" rx="8"/>
    <rect x="840" y="124" width="36" height="56" rx="8"/>
  </g>
  <!-- el cuerpo del reporte -->
  <rect x="752" y="204" width="212" height="9" rx="4.5" fill="#132B41" opacity=".20"/>
  <rect x="752" y="224" width="156" height="9" rx="4.5" fill="#132B41" opacity=".20"/>
  <!-- salió por correo: el sobre, en la esquina del reporte -->
  <g transform="rotate(-8 1068 74)">
    <rect x="1000" y="28" width="136" height="92" rx="10" fill="#C5DCEB"/>
    <path d="M1000 40 L1068 84 L1136 40" fill="none" stroke="#FFFFFF" stroke-width="5"
          stroke-linejoin="round" opacity=".8"/>
  </g>

  <!-- ══ Las dos cifras no coinciden ══ -->
  <g fill="#00417B" opacity=".62">
    <rect x="568" y="132" width="64" height="9" rx="4.5"/>
    <rect x="568" y="160" width="64" height="9" rx="4.5"/>
  </g>
  <line x1="628" y1="118" x2="572" y2="184" stroke="#00417B" stroke-width="9"
        stroke-linecap="round" opacity=".62"/>

  <!-- ══ ¿De qué regla salen? De ninguna ══ -->
  <g fill="none" stroke="#00417B" stroke-width="3" stroke-linecap="round" opacity=".5">
    <path d="M380 268 C 416 322, 428 348, 464 352" stroke-dasharray="7 7"/>
    <path d="M820 268 C 784 322, 772 348, 736 352" stroke-dasharray="7 7"/>
  </g>
  <path d="M456 344 l10 8 -10 8" fill="none" stroke="#00417B" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round" opacity=".7"/>
  <path d="M744 344 l-10 8 10 8" fill="none" stroke="#00417B" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round" opacity=".7"/>

  <!-- El lugar de la regla: nada escrito, nadie firma, ningún sello -->
  <rect x="498" y="316" width="176" height="9" rx="4.5" fill="#132B41" opacity=".10"/>
  <rect x="498" y="338" width="132" height="9" rx="4.5" fill="#132B41" opacity=".10"/>
  <line x1="498" y1="388" x2="612" y2="388" stroke="#132B41" stroke-width="2.5"
        stroke-linecap="round" opacity=".18"/>
  <circle cx="672" cy="378" r="21" fill="none" stroke="#132B41" stroke-width="2.5"
          stroke-dasharray="5 6" opacity=".18"/>
  <rect x="470" y="286" width="260" height="132" rx="14" fill="none"
        stroke="#F0B443" stroke-width="3.5" stroke-dasharray="9 7" stroke-linecap="round"/>
</svg>
